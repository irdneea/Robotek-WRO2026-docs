<text x="30" y="1290" font-size="13" fill="#444">• Gris: la isla. Rojo claro: pasillo estrecho (0,6 m): menos espacio para girar, la curva se hace más cerrada.</text>
<text x="30" y="1312" font-size="13" fill="#444">• Las más grandes (3–4 lados abiertos) son las más difíciles: square180 (1,8 × 1,8) tiene todos los pasillos a 0,6 m.</text>
<text x="30" y="1334" font-size="13" fill="#444">• Faltan en el set estándar 10 combinaciones; el lab (open_lab) puede generarlas para probar el Open v5 en todas.</text>
