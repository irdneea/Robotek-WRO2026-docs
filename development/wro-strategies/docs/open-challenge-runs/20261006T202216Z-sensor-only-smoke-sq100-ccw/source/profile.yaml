# Sensor-only Open: same control values as open_fastservo_v4.
# Additional tuning defaults: robotek_control/open_config.py.
open_strategy:
  ros__parameters:
    direction: auto
    cruise_speed: 1.8
    corner_speed: 1.25
    first_corner_speed: 0.95
    finish_speed: 0.3
    outer_lane_distance: 0.15
    brake_margin: 0.15
    turn_front_distance: 0.35
    turn_front_latency: 0.5
    turn_steer: 0.25
    heading_kp: 0.8
    heading_kd: 0.2
