<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="26" font-size="18" font-weight="bold" text-anchor="middle">Wiring diagram of the car (version 12)</text>
<rect x="40" y="70" width="170" height="56" rx="8" fill="#fde8c8" stroke="#333" stroke-width="1.2"/>
<text x="125.0" y="94.5" font-size="12" font-weight="bold" text-anchor="middle">Battery</text>
<text x="125.0" y="109.5" font-size="12" font-weight="normal" text-anchor="middle">2S LiPo 7.4 V</text>
<rect x="330" y="150" width="250" height="190" rx="8" fill="#d6e6fa" stroke="#333" stroke-width="1.2"/>
<text x="455.0" y="219.0" font-size="12" font-weight="bold" text-anchor="middle">RRC Lite board (Hiwonder)</text>
<text x="455.0" y="234.0" font-size="12" font-weight="normal" text-anchor="middle">STM32F407</text>
<text x="455.0" y="249.0" font-size="12" font-weight="normal" text-anchor="middle">IMU MPU6050, button K1, LEDs</text>
<text x="455.0" y="264.0" font-size="12" font-weight="normal" text-anchor="middle">battery monitor</text>
<text x="455.0" y="279.0" font-size="12" font-weight="normal" text-anchor="middle">ports: VIN, USB, J4, M2</text>
<rect x="700" y="70" width="250" height="120" rx="8" fill="#e6dcf5" stroke="#333" stroke-width="1.2"/>
<text x="825.0" y="119.0" font-size="12" font-weight="bold" text-anchor="middle">Raspberry Pi 5</text>
<text x="825.0" y="134.0" font-size="12" font-weight="normal" text-anchor="middle">Ubuntu 24.04, ROS 2 Jazzy</text>
<text x="825.0" y="149.0" font-size="12" font-weight="normal" text-anchor="middle">USB-A x2, CSI, GPIO header</text>
<rect x="700" y="220" width="250" height="52" rx="8" fill="#dff3df" stroke="#333" stroke-width="1.2"/>
<text x="825.0" y="242.5" font-size="12" font-weight="bold" text-anchor="middle">LDROBOT LD19 LiDAR</text>
<text x="825.0" y="257.5" font-size="12" font-weight="normal" text-anchor="middle">USB (CP2102), 230400 baud</text>
<rect x="700" y="300" width="250" height="52" rx="8" fill="#dff3df" stroke="#333" stroke-width="1.2"/>
<text x="825.0" y="322.5" font-size="12" font-weight="bold" text-anchor="middle">Pi camera, wide lens (imx708)</text>
<text x="825.0" y="337.5" font-size="12" font-weight="normal" text-anchor="middle">CSI ribbon cable</text>
<rect x="700" y="380" width="250" height="70" rx="8" fill="#dff3df" stroke="#333" stroke-width="1.2"/>
<text x="825.0" y="404.0" font-size="12" font-weight="bold" text-anchor="middle">VL53L0X rear distance</text>
<text x="825.0" y="419.0" font-size="12" font-weight="normal" text-anchor="middle">I2C bus 1, address 0x29</text>
<text x="825.0" y="434.0" font-size="12" font-weight="normal" text-anchor="middle">VIN pin 1 (3.3 V), SDA pin 3, SCL pin 5, GND</text>
<rect x="700" y="480" width="250" height="52" rx="8" fill="#dff3df" stroke="#333" stroke-width="1.2"/>
<text x="825.0" y="502.5" font-size="12" font-weight="bold" text-anchor="middle">Extra push button</text>
<text x="825.0" y="517.5" font-size="12" font-weight="normal" text-anchor="middle">GPIO 16 and GND</text>
<rect x="330" y="400" width="250" height="56" rx="8" fill="#f8d9d9" stroke="#333" stroke-width="1.2"/>
<text x="455.0" y="424.5" font-size="12" font-weight="bold" text-anchor="middle">Steering servo, 15 kg*cm</text>
<text x="455.0" y="439.5" font-size="12" font-weight="normal" text-anchor="middle">PWM port J4 (channel 1)</text>
<rect x="330" y="500" width="250" height="70" rx="8" fill="#f8d9d9" stroke="#333" stroke-width="1.2"/>
<text x="455.0" y="524.0" font-size="12" font-weight="bold" text-anchor="middle">Drive motor Hiwonder JGA27-310R</text>
<text x="455.0" y="539.0" font-size="12" font-weight="normal" text-anchor="middle">encoder, 20:1, 450 rpm</text>
<text x="455.0" y="554.0" font-size="12" font-weight="normal" text-anchor="middle">rear axle, port M2</text>
<path d="M210,98 L270,98 L270,190 L330,190" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="270" y="180" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">VIN 6-14 V (powers everything)</text>
<path d="M580,175 L700,105" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="640" y="128" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">USB-C 5 V / 5 A</text>
<path d="M580,215 L700,150" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="632" y="198" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">USB serial 1 Mbaud</text>
<path d="M680,175 L700,175" fill="none" stroke="#333" stroke-width="1.6"/>
<path d="M680,175 L680,506" fill="none" stroke="#333" stroke-width="1.6"/>
<path d="M680,246 L700,246" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="690" y="238" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">USB</text>
<path d="M680,326 L700,326" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="690" y="318" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">CSI</text>
<path d="M680,415 L700,415" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="690" y="407" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">I2C</text>
<path d="M680,506 L700,506" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="690" y="498" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">GPIO</text>
<path d="M455,340 L455,400" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<text x="500" y="372" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">PWM 50 Hz</text>
<path d="M455,456 L455,500" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="525" y="484" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">M2 power + encoder</text>
<rect x="40" y="600" width="14" height="14" fill="#fde8c8" stroke="#333"/>
<text x="60" y="612" font-size="11" text-anchor="start" font-weight="normal">Power source</text>
<rect x="190" y="600" width="14" height="14" fill="#d6e6fa" stroke="#333"/>
<text x="210" y="612" font-size="11" text-anchor="start" font-weight="normal">Controller</text>
<rect x="340" y="600" width="14" height="14" fill="#e6dcf5" stroke="#333"/>
<text x="360" y="612" font-size="11" text-anchor="start" font-weight="normal">Computer</text>
<rect x="490" y="600" width="14" height="14" fill="#dff3df" stroke="#333"/>
<text x="510" y="612" font-size="11" text-anchor="start" font-weight="normal">Sensor</text>
<rect x="640" y="600" width="14" height="14" fill="#f8d9d9" stroke="#333"/>
<text x="660" y="612" font-size="11" text-anchor="start" font-weight="normal">Actuator</text>
<text x="40" y="625" font-size="11" text-anchor="start" font-weight="normal">Red lines carry power, black lines carry data or control signals. One battery feeds the board; the board powers the Raspberry Pi, the servo and the motor.</text>
</svg>