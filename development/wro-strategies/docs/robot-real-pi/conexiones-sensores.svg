<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Conexión de sensores del coche Robotek</title>
  <desc>Qué dispositivo va a qué controlador USB del Raspberry Pi 5, y el resto de conexiones (alimentación, GPIO).</desc>
  <rect width="1240" height="900" fill="#ffffff"/>
  <rect width="1240" height="78" fill="#1f2937"/>
  <text x="32" y="38" font-size="25" font-weight="700" fill="#ffffff">Conexión de sensores · coche Robotek (Raspberry Pi 5 + RRC Lite)</text>
  <text x="32" y="62" font-size="14" fill="#d1d5db">Reporte del 9 oct 2026, medido en el Pi (tools/pi_usb_map.sh y tools/usb_stress_test.py) · los 3 sensores son USB 2.0 / 1.1: ninguno necesita USB 3.0</text>

  <!-- Column titles -->
  <text x="32" y="112" font-size="16" font-weight="700" fill="#111827">1 · Sensores USB</text>
  <text x="446" y="112" font-size="16" font-weight="700" fill="#111827">2 · Raspberry Pi 5: 2 controladores USB</text>
  <text x="900" y="112" font-size="16" font-weight="700" fill="#111827">3 · Resto de conexiones</text>

  <!-- Devices (top to bottom as they connect to the controllers) -->
  <g>
    <rect x="32" y="130" width="300" height="136" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="48" y="156" font-size="16" font-weight="700" fill="#c2410c">Cámara icSpring (UVC)</text>
    <text x="48" y="178" font-size="13" fill="#1f2937">USB 32e6:9005 · 480 Mbit/s (USB 2.0) · 100 mA</text>
    <text x="48" y="198" font-size="13" fill="#1f2937">640×480 YUYV · 6–16 fps según la luz</text>
    <text x="48" y="224" font-size="11" fill="#4b5563" font-family="Menlo, Consolas, monospace">/dev/v4l/by-id/usb-icSpring_icspring_</text>
    <text x="48" y="240" font-size="11" fill="#4b5563" font-family="Menlo, Consolas, monospace">camera-video-index0</text>
    <text x="48" y="257" font-size="12" font-weight="700" fill="#b45309">Prioridad 3: la única que usa ancho de banda</text>
  </g>
  <g>
    <rect x="32" y="300" width="300" height="136" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="48" y="326" font-size="16" font-weight="700" fill="#047857">LiDAR LD19 (CP2102)</text>
    <text x="48" y="348" font-size="13" fill="#1f2937">USB 10c4:ea60 · 12 Mbit/s (USB 1.1) · 100 mA</text>
    <text x="48" y="368" font-size="13" fill="#1f2937">230 400 baud · /scan 10–12 Hz</text>
    <text x="48" y="394" font-size="11" fill="#4b5563" font-family="Menlo, Consolas, monospace">/dev/serial/by-id/usb-Silicon_Labs_</text>
    <text x="48" y="410" font-size="11" fill="#4b5563" font-family="Menlo, Consolas, monospace">CP2102_…_0001-if00-port0</text>
    <text x="48" y="427" font-size="12" font-weight="700" fill="#b45309">Prioridad 2: poco tráfico (&lt; 0,3 Mbit/s)</text>
  </g>
  <g>
    <rect x="32" y="470" width="300" height="136" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="48" y="496" font-size="16" font-weight="700" fill="#1d4ed8">RRC Lite (placa STM32)</text>
    <text x="48" y="518" font-size="13" fill="#1f2937">USB 1a86:55d4 · 12 Mbit/s (USB 1.1) · 136 mA</text>
    <text x="48" y="538" font-size="13" fill="#1f2937">IMU 49 Hz · batería · botón · servo</text>
    <text x="48" y="564" font-size="11" fill="#4b5563" font-family="Menlo, Consolas, monospace">/dev/serial/by-id/usb-1a86_USB_</text>
    <text x="48" y="580" font-size="11" fill="#4b5563" font-family="Menlo, Consolas, monospace">Single_Serial_586B015678-if00</text>
    <text x="48" y="597" font-size="12" font-weight="700" fill="#b91c1c">Prioridad 1: la más crítica del coche</text>
  </g>

  <!-- Pi -->
  <rect x="446" y="130" width="400" height="476" rx="14" fill="#f9fafb" stroke="#111827" stroke-width="2.5"/>
  <text x="466" y="158" font-size="17" font-weight="700" fill="#111827">Raspberry Pi 5 (fuente negociada: 5 A)</text>

  <g>
    <rect x="466" y="176" width="360" height="188" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="482" y="200" font-size="14" font-weight="700" fill="#111827">Controlador xhci-hcd.0</text>
    <text x="482" y="218" font-size="12" fill="#4b5563">cada controlador: USB 3.0 (5 Gbit/s) + USB 2.0 (480 Mbit/s)</text>
    <rect x="486" y="236" width="150" height="46" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="561" y="256" font-size="13" font-weight="700" text-anchor="middle" fill="#c2410c">Cámara icSpring</text>
    <text x="561" y="273" font-size="11" text-anchor="middle" fill="#374151">puerto 1 · azul (3.0)</text>
    <rect x="656" y="236" width="150" height="46" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="731" y="256" font-size="13" font-weight="700" text-anchor="middle" fill="#047857">LiDAR LD19</text>
    <text x="731" y="273" font-size="11" text-anchor="middle" fill="#374151">puerto 2 · negro (2.0)</text>
    <text x="482" y="312" font-size="12" fill="#111827">Cámara y LiDAR comparten controlador: en la</text>
    <text x="482" y="330" font-size="12" fill="#111827">prueba de estrés el LiDAR no perdió ni un mensaje.</text>
    <text x="482" y="352" font-size="11" fill="#6b7280">Puerto raíz 1 = azul, 2 = negro (confirmado el 9 oct)</text>
  </g>
  <g>
    <rect x="466" y="388" width="360" height="196" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="482" y="412" font-size="14" font-weight="700" fill="#111827">Controlador xhci-hcd.1</text>
    <text x="482" y="430" font-size="12" fill="#4b5563">cada controlador: USB 3.0 (5 Gbit/s) + USB 2.0 (480 Mbit/s)</text>
    <rect x="486" y="448" width="150" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 4"/>
    <text x="561" y="468" font-size="13" text-anchor="middle" fill="#6b7280">libre</text>
    <text x="561" y="485" font-size="11" text-anchor="middle" fill="#6b7280">puerto 1 · azul (3.0)</text>
    <rect x="656" y="448" width="150" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="731" y="468" font-size="13" font-weight="700" text-anchor="middle" fill="#1d4ed8">RRC Lite</text>
    <text x="731" y="485" font-size="11" text-anchor="middle" fill="#374151">puerto 2 · negro (2.0)</text>
    <text x="482" y="524" font-size="12" fill="#111827">Placa en USB 2.0: IMU 48,9 Hz, hueco máx 41 ms;</text>
    <text x="482" y="542" font-size="12" fill="#111827">con la CPU al 100 %: 48,8 Hz, hueco máx 43 ms.</text>
    <text x="482" y="564" font-size="11" fill="#6b7280">Sin errores USB en el kernel en 3 min de prueba.</text>
  </g>

  <!-- Cables -->
  <path d="M332 198 H400 V259 H486" fill="none" stroke="#ea580c" stroke-width="3.5"/>
  <polygon points="486,259 476,253 476,265" fill="#ea580c"/>
  <path d="M332 368 H420 V318 H466" fill="none" stroke="#059669" stroke-width="3.5"/>
  <polygon points="466,318 456,312 456,324" fill="#059669"/>
  <path d="M332 538 H430 V508 H731 V504" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <polygon points="731,494 725,505 737,505" fill="#2563eb"/>

  <!-- Right column -->
  <g>
    <rect x="880" y="130" width="328" height="170" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="896" y="156" font-size="15" font-weight="700" fill="#854d0e">Alimentación</text>
    <text x="896" y="180" font-size="12.5" fill="#1f2937">Batería 2S (6–14 V) → entrada de la RRC Lite</text>
    <text x="896" y="200" font-size="12.5" fill="#1f2937">RRC Lite 5 V / 5 A (Type‑C, PD) → USB‑C del Pi</text>
    <text x="896" y="224" font-size="12.5" fill="#1f2937">USB del Pi: 1,6 A en total (usb_max_current_enable=1)</text>
    <text x="896" y="244" font-size="12.5" fill="#1f2937">Consumo declarado: 100 + 100 + 136 mA</text>
    <text x="896" y="270" font-size="12.5" font-weight="700" fill="#b91c1c">battery_guard para el coche bajo 6,6 V</text>
    <text x="896" y="288" font-size="11.5" fill="#6b7280">(la placa se apaga bajo 6 V)</text>
  </g>
  <g>
    <rect x="880" y="320" width="328" height="170" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="896" y="346" font-size="15" font-weight="700" fill="#5b21b6">Pines GPIO del Pi (no son USB)</text>
    <text x="896" y="370" font-size="12.5" fill="#1f2937">Motor, driver TB6612 (gpiochip4):</text>
    <text x="896" y="390" font-size="12.5" fill="#1f2937" font-family="Menlo, Consolas, monospace">PWM GPIO12 · AIN1 GPIO5</text>
    <text x="896" y="408" font-size="12.5" fill="#1f2937" font-family="Menlo, Consolas, monospace">AIN2 GPIO6 · STBY GPIO13</text>
    <text x="896" y="434" font-size="12.5" fill="#1f2937">Tira LED WS2812: SPI0, GPIO10 (pin 19)</text>
    <text x="896" y="454" font-size="12.5" fill="#b91c1c">Brillo bajo: al 100 % reinició el Pi</text>
    <text x="896" y="474" font-size="11.5" fill="#6b7280">STBY en alto: sin él el motor no gira</text>
  </g>
  <g>
    <rect x="880" y="510" width="328" height="96" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="896" y="536" font-size="15" font-weight="700" fill="#155e75">En la RRC Lite (no USB)</text>
    <text x="896" y="560" font-size="12.5" fill="#1f2937">Servo de dirección → puerto de servo PWM</text>
    <text x="896" y="578" font-size="12.5" fill="#6b7280">(número de puerto: por confirmar en el coche)</text>
    <text x="896" y="596" font-size="12.5" fill="#1f2937">Botón de usuario de la placa: Start / Stop</text>
  </g>

  <!-- Rules -->
  <rect x="32" y="636" width="1176" height="236" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="52" y="666" font-size="17" font-weight="700" fill="#111827">Reglas para conectar</text>
  <g font-size="14" fill="#111827">
    <text x="52" y="694"><tspan font-weight="700">1 · No hace falta USB 3.0.</tspan> Los tres sensores negocian 480 o 12 Mbit/s: la placa en un puerto 2.0 no pierde mensajes.</text>
    <text x="52" y="720"><tspan font-weight="700">2 · Reparto probado:</tspan> cámara en un azul; LiDAR y placa en negros. Cámara y LiDAR comparten controlador sin problema.</text>
    <text x="52" y="746"><tspan font-weight="700">3 · Usar siempre los nombres by-id</tspan> (no /dev/ttyUSBn ni /dev/videoN): el número cambia con el orden y el puerto.</text>
    <text x="52" y="772"><tspan font-weight="700">4 · Conectar los tres antes de encender.</tspan> Si se mueve uno con el stack corriendo, hay que relanzarlo (se queda sin datos).</text>
    <text x="52" y="798"><tspan font-weight="700">5 · Sin dispositivos USB 3.0</tspan> (SSD, hubs 3.0) cerca de la antena: pueden interferir con el Wi‑Fi de 2,4 GHz (RViz).</text>
    <text x="52" y="824"><tspan font-weight="700">6 · Cambio de placa o de LiDAR:</tspan> los nombres by-id llevan el número de serie; actualizar la ruta en rrc_driver.py (paquete rrc_lite_driver).</text>
    <text x="52" y="850"><tspan font-weight="700">Verificar:</tspan> <tspan font-family="Menlo, Consolas, monospace" font-size="13">ssh user@192.168.0.10 'bash -s' &lt; tools/pi_usb_map.sh</tspan></text>
  </g>
</svg>
