<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<rect width="900" height="460" fill="#ffffff"/>
<text x="450.0" y="26" font-size="18" font-weight="bold" text-anchor="middle">Power distribution</text>
<rect x="40" y="80" width="190" height="56" rx="8" fill="#fde8c8" stroke="#333" stroke-width="1.2"/>
<text x="135.0" y="104.5" font-size="12" font-weight="bold" text-anchor="middle">Electronics battery</text>
<text x="135.0" y="119.5" font-size="12" font-weight="normal" text-anchor="middle">2S LiPo 7.4 V</text>
<rect x="40" y="300" width="190" height="56" rx="8" fill="#fde8c8" stroke="#333" stroke-width="1.2"/>
<text x="135.0" y="324.5" font-size="12" font-weight="bold" text-anchor="middle">Motor battery</text>
<text x="135.0" y="339.5" font-size="12" font-weight="normal" text-anchor="middle">2S LiPo 7.4 V</text>
<rect x="330" y="70" width="190" height="76" rx="8" fill="#d6e6fa" stroke="#333" stroke-width="1.2"/>
<text x="425.0" y="97.0" font-size="12" font-weight="bold" text-anchor="middle">RRC Lite board</text>
<text x="425.0" y="112.0" font-size="12" font-weight="normal" text-anchor="middle">VIN 6-14 V</text>
<text x="425.0" y="127.0" font-size="12" font-weight="normal" text-anchor="middle">servo rail (jumper: 5 V or battery)</text>
<rect x="620" y="40" width="240" height="56" rx="8" fill="#e6dcf5" stroke="#333" stroke-width="1.2"/>
<text x="740.0" y="64.5" font-size="12" font-weight="bold" text-anchor="middle">Raspberry Pi 5</text>
<text x="740.0" y="79.5" font-size="12" font-weight="normal" text-anchor="middle">5 V, up to 5 A from USB-C (PD)</text>
<rect x="620" y="120" width="240" height="40" rx="8" fill="#dff3df" stroke="#333" stroke-width="1.2"/>
<text x="740.0" y="144.0" font-size="12" font-weight="bold" text-anchor="middle">LD19 LiDAR: 5 V USB, 100 mA</text>
<rect x="620" y="175" width="260" height="40" rx="8" fill="#dff3df" stroke="#333" stroke-width="1.2"/>
<text x="750.0" y="198.66666666666666" font-size="11" font-weight="bold" text-anchor="middle">Camera and VL53L0X: 3.3 V from the Pi</text>
<rect x="330" y="190" width="190" height="56" rx="8" fill="#f8d9d9" stroke="#333" stroke-width="1.2"/>
<text x="425.0" y="214.5" font-size="12" font-weight="bold" text-anchor="middle">Steering servo</text>
<text x="425.0" y="229.5" font-size="12" font-weight="normal" text-anchor="middle">from the servo rail</text>
<rect x="330" y="290" width="190" height="76" rx="8" fill="#f8d9d9" stroke="#333" stroke-width="1.2"/>
<text x="425.0" y="317.0" font-size="12" font-weight="bold" text-anchor="middle">Motor port M2</text>
<text x="425.0" y="332.0" font-size="12" font-weight="normal" text-anchor="middle">drive motor + encoder</text>
<text x="425.0" y="347.0" font-size="12" font-weight="normal" text-anchor="middle">stall current is the risk</text>
<path d="M230,108 L330,108" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="280.0" y="103.0" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">7.4 V</text>
<path d="M520,90 L570,90 L570,68 L620,68" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="568" y="60" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">5 V / 5 A</text>
<path d="M430,146 L430,190" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="470" y="172" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">servo rail</text>
<path d="M230,328 L330,328" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="280.0" y="323.0" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">7.4 V</text>
<path d="M740,96 L740,120" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M740,160 L740,175" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="410" font-size="11" text-anchor="start" font-weight="normal">Measured on 8 Oct 2026 (single-battery test): Pi 5 V input idle 5.00-5.03 V, minimum 4.835 V, drop under 83 mV on motor pulses,</text>
<text x="40" y="428" font-size="11" text-anchor="start" font-weight="normal">under-voltage threshold about 4.63 V. The motor battery was separated on 9 Oct so a motor stall can never reboot the Pi.</text>
<text x="40" y="446" font-size="11" text-anchor="start" font-weight="normal">battery_guard warns below 6.8 V. Current draw of the electronics in a full round is still to be measured with a clamp meter.</text>
</svg>