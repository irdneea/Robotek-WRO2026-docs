<text x="552.8" y="200" font-size="12" text-anchor="start" font-weight="normal">right wheel 17.6 deg</text>
<text x="552.8" y="224" font-size="12" text-anchor="start" font-weight="normal">Strategies are limited to 17.5-17.6 deg</text>
<text x="552.8" y="242" font-size="12" text-anchor="start" font-weight="normal">(rules allow up to 25 deg).</text>
<text x="552.8" y="280" font-size="12" text-anchor="start" font-weight="normal">Rear-wheel drive, Ackermann front.</text>
<text x="552.8" y="298" font-size="12" text-anchor="start" font-weight="normal">Reference point base_link: midway</text>
<text x="552.8" y="316" font-size="12" text-anchor="start" font-weight="normal">between the axles, on the floor.</text>
<text x="552.8" y="354" font-size="12" text-anchor="start" font-weight="normal">Rule limits: 300 x 200 mm, 300 mm high,</text>
<text x="552.8" y="372" font-size="12" text-anchor="start" font-weight="normal">1.5 kg. Mass and height still to be</text>
<text x="552.8" y="390" font-size="12" text-anchor="start" font-weight="normal">measured on the finished car.</text>
<text x="40" y="500" font-size="11" text-anchor="start" font-weight="normal">Wheel angles measured with circles on the floor (tools/steer_calibration.py). Front is to the right.</text>
