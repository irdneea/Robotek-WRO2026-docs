<text x="30" y="84" font-size="13" fill="#444">La isla va de 1,0 × 1,0 m a 1,8 × 1,8 m. En verde, las 6 del set estándar del equipo (open_standard_suite.sh); en rojo, los pasillos estrechos.</text>
