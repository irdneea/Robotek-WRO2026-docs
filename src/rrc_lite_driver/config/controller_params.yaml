rrc_driver:
  ros__parameters:
    imu_frame: "imu_link"
    init_finish: false
    port: ""          # empty = /dev/rrc_lite (udev) or /dev/ttyACM0
    acker_channel: 1  # PWM channel of the steering servo: on our car, J4 is channel 1 (measured 1 Nov 2026)
    # Motor type: -1 = do NOT send it (8 Nov 2026). The board then uses its factory type, and its speed loop follows
    # the rps and stops at 0. With type 2 (JGA27, negative PID gains in the firmware) our encoder counts the other way
    # and the loop ran away: full PWM, no stop at 0, sometimes reversing (1-4 Nov). MentorPi does not send it either.
    # If the board resets it goes back to its factory type, which is the right one.
    motor_type: -1
