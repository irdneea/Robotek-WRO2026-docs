<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="330" fill="#fbfbfa"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#111">Engranajes del coche: 54:30 y 30:54</text>
<text x="30" y="64" font-size="13" fill="#444">Motor JGA27-310R: 450 rpm sin carga a 7,4 V; rueda r = 30,5 mm. Velocidad sin carga (teórica).</text>
<text x="30" y="84" font-size="13" fill="#444">En el coche real va bastante menos: con 54:30 el Open pidió 1,28 m/s y midió ~0,45 m/s (11 nov 2026).</text>
<text x="30" y="116" font-size="13" font-weight="bold" fill="#222">Motor : rueda</text>
<text x="260" y="116" font-size="13" font-weight="bold" fill="#222">Relación</text>
<text x="420" y="116" font-size="13" font-weight="bold" fill="#222">Velocidad sin carga</text>
<text x="780" y="116" font-size="13" font-weight="bold" fill="#222">Fuerza vs 54:30</text>
<rect x="20" y="124" width="960" height="40" rx="6" fill="#e3f2fd"/>
<text x="30" y="150" font-size="15" font-weight="bold" fill="#111">54 : 30  (grande en el motor, ahora)</text>
<text x="260" y="150" font-size="15" fill="#333">×1.80</text>
<text x="420" y="150" font-size="15" fill="#333">2.59 m/s</text>
<rect x="510" y="136" width="240" height="18" rx="3" fill="#1e88e5" opacity="0.75"/>
<rect x="780" y="136" width="50" height="18" rx="3" fill="#43a047" opacity="0.75"/>
<text x="836" y="150" font-size="13" fill="#333">×1.00</text>
<rect x="20" y="174" width="960" height="40" rx="6" fill="#f3e5f5"/>
<text x="30" y="200" font-size="15" font-weight="bold" fill="#111">30 : 54  (pequeño en el motor)</text>
<text x="260" y="200" font-size="15" fill="#333">×0.56</text>
<text x="420" y="200" font-size="15" fill="#333">0.80 m/s</text>
<rect x="510" y="186" width="74" height="18" rx="3" fill="#8e24aa" opacity="0.75"/>
<rect x="780" y="186" width="162" height="18" rx="3" fill="#43a047" opacity="0.75"/>
<text x="948" y="200" font-size="13" fill="#333">×3.24</text>
<text x="30" y="250" font-size="13" fill="#444">• 54:30: más velocidad (el Open). Poca fuerza a baja velocidad con el giro a tope: el coche puede no arrancar.</text>
<text x="30" y="272" font-size="13" fill="#444">• 30:54: 3,24 veces más fuerza y máxima ~0,8 m/s: de sobra para el Obstacle, que pide 0,15–0,30 m/s.</text>
</svg>