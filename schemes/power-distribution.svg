<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="450.0" y="26" font-size="18" font-weight="bold" text-anchor="middle">Power distribution (version 12: one battery)</text>
<rect x="40" y="150" width="190" height="56" rx="8" fill="#fde8c8" stroke="#333" stroke-width="1.2"/>
<text x="135.0" y="174.5" font-size="12" font-weight="bold" text-anchor="middle">Battery</text>
<text x="135.0" y="189.5" font-size="12" font-weight="normal" text-anchor="middle">2S LiPo 7.4 V</text>
<rect x="330" y="130" width="210" height="96" rx="8" fill="#d6e6fa" stroke="#333" stroke-width="1.2"/>
<text x="435.0" y="159.5" font-size="12" font-weight="bold" text-anchor="middle">RRC Lite board</text>
<text x="435.0" y="174.5" font-size="12" font-weight="normal" text-anchor="middle">VIN 6-14 V</text>
<text x="435.0" y="189.5" font-size="12" font-weight="normal" text-anchor="middle">battery voltage monitor</text>
<text x="435.0" y="204.5" font-size="12" font-weight="normal" text-anchor="middle">regulated 5 V for the Pi</text>
<rect x="650" y="50" width="220" height="56" rx="8" fill="#e6dcf5" stroke="#333" stroke-width="1.2"/>
<text x="760.0" y="74.5" font-size="12" font-weight="bold" text-anchor="middle">Raspberry Pi 5</text>
<text x="760.0" y="89.5" font-size="12" font-weight="normal" text-anchor="middle">5 V, up to 5 A (USB-C)</text>
<rect x="650" y="120" width="220" height="36" rx="8" fill="#dff3df" stroke="#333" stroke-width="1.2"/>
<text x="760.0" y="141.66666666666666" font-size="11" font-weight="bold" text-anchor="middle">LD19 LiDAR: 5 V USB, 100 mA</text>
<rect x="650" y="166" width="220" height="36" rx="8" fill="#dff3df" stroke="#333" stroke-width="1.2"/>
<text x="760.0" y="187.66666666666666" font-size="11" font-weight="bold" text-anchor="middle">Camera, VL53L0X: 3.3 V from the Pi</text>
<rect x="330" y="280" width="210" height="50" rx="8" fill="#f8d9d9" stroke="#333" stroke-width="1.2"/>
<text x="435.0" y="301.5" font-size="12" font-weight="bold" text-anchor="middle">Steering servo (port J4)</text>
<text x="435.0" y="316.5" font-size="12" font-weight="normal" text-anchor="middle">from the board</text>
<rect x="650" y="280" width="220" height="66" rx="8" fill="#f8d9d9" stroke="#333" stroke-width="1.2"/>
<text x="760.0" y="302.0" font-size="12" font-weight="bold" text-anchor="middle">Drive motor (port M2)</text>
<text x="760.0" y="317.0" font-size="12" font-weight="normal" text-anchor="middle">battery voltage from the board</text>
<text x="760.0" y="332.0" font-size="12" font-weight="normal" text-anchor="middle">stall current is the risk</text>
<path d="M230,178 L330,178" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="280.0" y="173.0" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">7.4 V</text>
<path d="M540,150 L600,150 L600,78 L650,78" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="600" y="70" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">5 V / 5 A</text>
<path d="M435,226 L435,280" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="475" y="258" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">servo rail</text>
<path d="M540,205 L600,205 L600,313 L650,313" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="598" y="252" font-size="11" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">motor power</text>
<path d="M760,106 L760,120" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M760,156 L760,166" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="380" font-size="11" text-anchor="start" font-weight="normal">Measured on 8 Oct 2026 with one battery feeding motor and Pi: Pi 5 V input idle 5.00-5.03 V, minimum 4.835 V, drop under 83 mV on</text>
<text x="40" y="398" font-size="11" text-anchor="start" font-weight="normal">motor pulses; under-voltage threshold about 4.63 V. battery_guard warns below 6.8 V. A hard motor stall has not been measured.</text>
</svg>